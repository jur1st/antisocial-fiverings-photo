baseURL = 'https://antisocial.fiverings.photo/'
languageCode = 'en-us'
title = 'antisocial.fiverings.photo'

# Enable canonifyURLs for GitHub Pages subdirectory deployment
canonifyURLs = true

# Disable problematic features for development
disableRSS = true
disableKinds = ["RSS", "taxonomy", "term"]

# Enhanced image processing configuration - fixes orientation issues
[imaging]
  quality = 90          # Higher quality for fewer regenerations
  resampleFilter = "Lanczos"
  anchor = "Smart"
  bgColor = "#000000"   # Black background for consistent thumbnails
  hint = "photo"        # Optimize processing for photography
  # Enable modern formats with fallbacks
  formats = ["webp", "jpg"]

[params]
  title = 'antisocial.fiverings.photo'
  description = 'Antisocial FiveRings Photography'
  author = 'John Benson'
  
  # Enhanced thumbnail processing parameters
  [params.images]
    thumbnail = "400x400"
    gallery = "800x800"
    full = ["1200x", "1920x", "2560x"]
    formats = ["webp", "jpg"]
    
  # Thumbnail generation settings - prevents orientation issues
  [params.thumbnails]
    enabled = true
    generateOnBuild = true    # Ensure thumbnails exist
    preserveOrientation = true # Respect EXIF orientation
    sizes = ["400x400", "800x800"]
    formats = ["webp", "jpg"]
    quality = 90

[author]
  name = 'John Benson'
  email = 'john@darkolabs.io'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
  enableInlineShortcodes = false
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^CSS_MODE$']