{{- /*
    CSS Loader Partial - Optimized Version
    Always loads the complete optimized CSS that includes all production styles
*/ -}}

{{- $optimizedProd := "css/dist/gallery.min.css" -}}
{{- $optimizedDev := "css/dist/gallery.css" -}}

{{- if hugo.IsProduction -}}
    <!-- Complete Optimized Production CSS (minified, includes all original CSS content) -->
    <link rel="stylesheet" href="{{ $optimizedProd | relURL }}">
{{- else -}}
    <!-- Complete Optimized Development CSS (with source maps, includes all original CSS content) -->
    <link rel="stylesheet" href="{{ $optimizedDev | relURL }}">
{{- end -}}
