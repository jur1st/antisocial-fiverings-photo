<header class="site-header">
    <div class="header-container">
        <div class="site-branding">
            <a href="/" class="site-title">{{ .Site.Title }}</a>
        </div>
        <div class="header-actions">
            <button id="theme-toggle" class="theme-toggle-btn" style="display: none;">
                <span class="theme-label">Camera Mode</span>
            </button>
        </div>
    </div>
</header>

<script>
// Flynn theme locked as default - theme switching preserved for future use
document.addEventListener('DOMContentLoaded', function() {
  // Clear any saved theme preference
  localStorage.removeItem('theme');
  
  // Force Flynn theme (Tron aesthetic)
  document.documentElement.setAttribute('data-theme', 'flynn');
  
  /* PRESERVED THEME TOGGLE CODE - Uncomment to restore theme switching
  const themeToggle = document.getElementById('theme-toggle');
  const themeLabel = document.querySelector('.theme-label');
  
  if (themeToggle && themeLabel) {
    // Define theme options
    const themes = [
      { name: 'light', label: 'Camera Mode', next: 'camera' },
      { name: 'camera', label: 'Flynn Mode', next: 'flynn' },
      { name: 'flynn', label: 'Light Mode', next: 'light' }
    ];
    
    // Load saved theme preference
    const savedTheme = localStorage.getItem('theme') || 'camera';
    const currentThemeConfig = themes.find(t => t.name === savedTheme);
    
    if (savedTheme !== 'camera') {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
    themeLabel.textContent = currentThemeConfig.label;
    
    themeToggle.addEventListener('click', function() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'camera';
      const themeConfig = themes.find(t => t.name === currentTheme);
      const nextTheme = themeConfig.next;
      const nextConfig = themes.find(t => t.name === nextTheme);
      
      if (nextTheme === 'camera') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', nextTheme);
      }
      
      themeLabel.textContent = nextConfig.label;
      localStorage.setItem('theme', nextTheme);
    });
  }
  END OF PRESERVED CODE */
});
</script>
